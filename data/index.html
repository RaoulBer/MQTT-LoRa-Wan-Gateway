<!DOCTYPE HTML><html>
<head>
  <title>MQTT Gateway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="index.css">
<title>MQTT Gateway</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
</head>
<body>
  <div class="topnav">
    <h1>MQTT Gateway</h1>
  </div>
  <div class="content">
    <div class="card">
      <h2>LORA WAN Settings</h2>
      <form>
        <div class="form-group">
          <label>Special Phrase:</label>
          <input type="text" name="specialphrase" placeholder="" value="">
        </div>
      </form>
    </div>
    <div class="card">
      <h2>Wifi Settings</h2>
      <form>
        <div class="form-group1">
          <label class="switch">Enable Wifi: </label>
          <input type="checkbox" name="wifissid" placeholder="" value="ON">
          <span class="slider round"></span>
        </div>
        <div class="form-group">
          <label>SSID:</label>
          <input type="text" name="wifissid" placeholder="" value="">
        </div>  
        <div class="form-group">
          <label>Password:</label>
          <input type="text" name="wifipassword" placeholder="Enter Password" value="">
        </div>      
      </form>
    </div>
    <div class="card">
      <h2>MQTT Settings</h2>
      <form>
        <div class="form-group">
          <label>Server IP-Address:</label>
          <input type="text" class="form-control" name="mqttipadress" placeholder="" value="">
        </div>
        <div class="form-group">
          <label>Login:</label>
          <input type="text" class="form-control" name="mqttlogin" placeholder="" value="">
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="text" class="form-control" name="mqttpassword" placeholder="" value="">
        </div>
      </form>
    </div>    
  </div>    
    <p><button id="button" class="button">Save & Reboot</button></p>
  </div>
  <script src="index.js"></script> 
</body>
</html>
